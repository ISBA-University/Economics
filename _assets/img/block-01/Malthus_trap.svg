```{=html}
<svg width="100%" viewBox="0 0 920 500" xmlns="http://www.w3.org/2000/svg">

  <!-- ===== LINKES PANEL: Falle ===== -->

  <!-- Achsen -->
  <line x1="80" y1="410" x2="430" y2="410" stroke="#232461" stroke-width="2" marker-end="url(#axisArr)"/>
<line x1="80" y1="410" x2="80" y2="50" stroke="#232461" stroke-width="2" marker-end="url(#axisArr)"/>
  <text x="255" y="455" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#232461" font-weight="600">Bevölkerung</text>
  <text x="30" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#232461" font-weight="600" transform="rotate(-90, 30, 230)">Reallohn (= AP)</text>
  <text x="255" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#232461" font-weight="600">Die Malthusianische Falle</text>

  <!-- Lohnkurve: GERADE Linie, fallend -->
  <g class="fragment" data-fragment-index="1">
    <line x1="100" y1="90" x2="410" y2="390" stroke="#d84116" stroke-width="2.5"/>
    <text x="415" y="385" font-family="sans-serif" font-size="13" fill="#d84116" font-weight="500">Lohn (= AP)</text>
  </g>

  <!-- Subsistenzniveau: horizontale Gerade -->
  <g class="fragment" data-fragment-index="2">
    <line x1="80" y1="250" x2="430" y2="250" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="8 4"/>
    <text x="435" y="255" font-family="sans-serif" font-size="12" fill="#6b6b6b">Subsistenz</text>
  </g>

  <!-- Gleichgewicht: Schnittpunkt -->
  <g class="fragment" data-fragment-index="3">
    <!-- Berechnung: Lohnkurve von (100,90) bis (410,390)
         y = 90 + (x-100) * (390-90)/(410-100) = 90 + (x-100) * 300/310
         Bei y=250: 250 = 90 + (x-100)*300/310 → 160 = (x-100)*0.968 → x-100=165.3 → x=265 -->
    <circle cx="265" cy="250" r="7" fill="#232461"/>
    <text x="275" y="240" font-family="sans-serif" font-size="14" fill="#232461" font-weight="600">GG</text>
    <line x1="265" y1="250" x2="265" y2="410" stroke="#232461" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="265" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#232461">N*</text>
  </g>

  <!-- Anpassungspfeile -->
  <g class="fragment" data-fragment-index="4">
    <!-- Links vom GG: Lohn über Subsistenz -->
    <text x="130" y="165" font-family="sans-serif" font-size="12" fill="#232461">Lohn &gt; Subsistenz</text>
    <text x="130" y="183" font-family="sans-serif" font-size="12" fill="#d84116" font-weight="500">→ Bevölkerung wächst</text>
    <!-- Pfeil nach rechts -->
    <line x1="180" y1="200" x2="240" y2="240" stroke="#d84116" stroke-width="1.5" marker-end="url(#arrMal)"/>

    <!-- Rechts vom GG: Lohn unter Subsistenz -->
    <text x="310" y="310" font-family="sans-serif" font-size="12" fill="#232461">Lohn &lt; Subsistenz</text>
    <text x="310" y="328" font-family="sans-serif" font-size="12" fill="#d84116" font-weight="500">→ Bevölkerung schrumpft</text>
    <!-- Pfeil nach links -->
    <line x1="340" y1="295" x2="280" y2="260" stroke="#d84116" stroke-width="1.5" marker-end="url(#arrMal)"/>
  </g>


  <!-- ===== RECHTES PANEL: Escape ===== -->

  <!-- Achsen -->
  <line x1="530" y1="410" x2="880" y2="410" stroke="#232461" stroke-width="2" marker-end="url(#axisArr)"/>
<line x1="530" y1="410" x2="530" y2="50" stroke="#232461" stroke-width="2" marker-end="url(#axisArr)"/>
  <text x="705" y="455" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#232461" font-weight="600">Bevölkerung</text>
  <text x="705" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#232461" font-weight="600">Der Escape</text>

  <g class="fragment" data-fragment-index="5">
    <!-- Alte Lohnkurve (gestrichelt, grau): GERADE -->
    <line x1="550" y1="130" x2="860" y2="390" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="865" y="385" font-family="sans-serif" font-size="11" fill="#6b6b6b">f₁</text>

    <!-- Subsistenz -->
    <line x1="530" y1="270" x2="880" y2="270" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="8 4"/>

    <!-- Altes GG -->
    <circle cx="700" cy="270" r="5" fill="#6b6b6b" opacity="0.5"/>
  </g>

  <g class="fragment" data-fragment-index="6">
    <!-- Neue Lohnkurve (nach oben verschoben): GERADE -->
    <line x1="550" y1="70" x2="860" y2="330" stroke="#d84116" stroke-width="2.5"/>
    <text x="865" y="325" font-family="sans-serif" font-size="13" fill="#d84116" font-weight="500">f₂</text>

    <!-- Neues GG (höher und weiter rechts) -->
    <!-- f2: y = 70 + (x-550)*(330-70)/(860-550) = 70 + (x-550)*260/310
         Bei y=270: 200 = (x-550)*0.839 → x-550=238 → x=788 -->
    <circle cx="788" cy="270" r="7" fill="#d84116"/>

    <!-- Vertikaler Pfeil: Technologie ↑ -->
    <line x1="620" y1="230" x2="620" y2="140" stroke="#d84116" stroke-width="2" marker-end="url(#arrMal)"/>
    <text x="635" y="170" font-family="sans-serif" font-size="13" fill="#d84116" font-weight="600">Technologie ↑</text>
    <text x="635" y="190" font-family="sans-serif" font-size="12" fill="#232461">→ Escape!</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrMal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="axisArr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
  <path d="M0 1L10 5L0 9Z" fill="#232461"/>
</marker>
  </defs>
</svg>
```